{{- if .Values.isManagement }}
{{- $chartVersion := .Chart.Version | replace "." "-" }}
{{- $mcsConfigs := list }}

{{- if .Values.managementCluster.includeInMesh }}
{{- $mcsConfigs = append $mcsConfigs (dict
    "name" (printf "%s-gateway-mgmt" .Chart.Name)
    "selfManagement" true
    "networkGateway" .Values.global.network
) }}
{{- end }}

{{- $mcsConfigs = append $mcsConfigs (dict
    "name" (printf "%s-gateway" .Chart.Name)
    "selfManagement" false
    "networkGateway" "{{ .Cluster.metadata.name }}-network"
) }}

{{- range $cfg := $mcsConfigs }}
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: MultiClusterService
metadata:
  name: {{ $cfg.name }}
spec:
  clusterSelector:
    matchLabels:
    {{- if $cfg.selfManagement }}
      k0rdent.mirantis.com/management-cluster: "true"
      # Workaround for https://github.com/k0rdent/kcm/issues/2610
    {{- else }}
      k0rdent.mirantis.com/istio-gateway: "true"
    {{- end }}
  dependsOn:
    - {{ $.Chart.Name }}-network
  serviceSpec:
  {{- if $cfg.selfManagement }}
    provider:
      selfManagement: true
  {{- end }}
    services:
      - name: istio-gateway
        namespace: {{ $.Release.Namespace }}
        template: {{ $.Chart.Name }}-gateway-{{ $chartVersion }}
        values: |
          name: istio-gateway-{{ `{{ printf "%s-%s" .Cluster.metadata.namespace .Cluster.metadata.name | adler32sum }}` }}
          networkGateway: {{ $cfg.networkGateway }}
          labels:
            istio: eastwestgateway

      {{- if $.Values.gateway.resource }}
      - name: gateway-template
        namespace: {{ $.Release.Namespace }}
        template: {{ $.Chart.Name }}-propagation-{{ $chartVersion }}
        dependsOn:
          - name: istio-gateway
            namespace: {{ $.Release.Namespace }}
        values: |
          propagation:
            enabled: true
            data: |
{{- $gatewayResource := $.Values.gateway.resource }}
{{- $processedResource := deepCopy $gatewayResource }}
{{- if $processedResource.spec.servers }}
{{- range $serverIdx, $server := $processedResource.spec.servers }}
{{- if $server.hosts }}
{{- $processedHosts := list }}
{{- range $host := $server.hosts }}
{{- $processedHosts = append $processedHosts ($host | replace "{clusterName}" "{{ .Cluster.metadata.name }}") }}
{{- end }}
{{- $_ := set $server "hosts" $processedHosts }}
{{- end }}
{{- end }}
{{- end }}
{{ toYaml $processedResource | nindent 14 }}
      {{- end }}
{{- end }}
{{- end }}
