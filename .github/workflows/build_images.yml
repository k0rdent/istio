name: "Build and push docker images"
on:
  workflow_call:
    outputs:
      version:
        description: "The built image version"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    concurrency:
      group: build-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    name: Build and Unit Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    permissions:
      packages: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Required for `git describe --tags`:
          fetch-depth: 0

      - uses: ./.github/actions/shared-setup
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "istio-operator/go.mod"
          cache: false
      - name: Unit tests
        working-directory: ./istio-operator
        run: |
          make test
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get outputs
        id: vars
        run: |
          GIT_VERSION=$(git describe --tags --always)
          echo "version=${GIT_VERSION}" >> $GITHUB_OUTPUT
      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --verbose --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ghcr.io/${{ steps.compute-repo.outputs.repo_lower }}/istio-operator-controller
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          VERSION: ${{ steps.vars.outputs.version }}
          SKIP_SCM_RELEASE: true
      - name: Push
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          push_image() {
            local repo="${REGISTRY}/$1"
            docker push "${repo}:${VERSION}-amd64"
            docker push "${repo}:${VERSION}-arm64"
            docker manifest create "${repo}:${VERSION}" \
              --amend "${repo}:${VERSION}-amd64" \
              --amend "${repo}:${VERSION}-arm64"
            docker manifest push "${repo}:${VERSION}"
          }

          push_image istio-operator-controller
