name: Test Adopted Clusters Upgrade

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - release/*
    paths:
      - "istio-operator/**"
      - "charts/**"
      - "!**.md"
      - ".github/workflows/pr_test_adopted_upgrade.yml"
jobs:
  get_kcm_release:
    name: Get Latest KCM Release
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: k0rdent
          repo: kcm
          excludes: prerelease, draft
    outputs:
      version: ${{ steps.release.outputs.release }}

  get_istio_release:
    name: Get Latest Istio Release
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          owner: k0rdent
          repo: istio
          excludes: prerelease, draft
    outputs:
      version: ${{ steps.release.outputs.release }}
  
  deploy:
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    needs: [get_kcm_release, get_istio_release]
    name: Upgrade Istio
    runs-on: ubuntu-latest
    steps:
      - name: "[PR] Checkout"
        uses: actions/checkout@v5
      - name: "[PR] Shared setup"
        uses: ./.github/actions/shared-setup
      - name: "[Latest KCM Release] Checkout"
        uses: actions/checkout@v5
        with:
          repository: k0rdent/kcm
          ref: ${{ needs.get_kcm_release.outputs.version }}
          path: kcm-repo
          fetch-depth: 0
      - name: "[Latest Istio Release] Checkout"
        uses: actions/checkout@v5
        with:
          repository: k0rdent/istio
          ref: ${{ needs.get_istio_release.outputs.version }}
          path: istio-repo
          fetch-depth: 0
      - name: "[Latest KCM Release] Go version"
        id: latest-kcm-go-version
        uses: arnested/go-version-action@v2
        with:
          working-directory: kcm-repo
      - name: "[Latest KCM Release] Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: kcm-repo/go.mod
          cache: false
      - name: "[Latest KCM Release] Install CLI"
        run: |
          make -C kcm-repo cli-install
      - name: "[Latest KCM Release] Create management KIND cluster"
        run: |
          make -C kcm-repo dev-apply
          kubectl wait --for create mgmt/kcm --timeout=1m
          kubectl patch mgmt/kcm --type='json' -p '[{"op": "replace", "path": "/spec/providers", "value":[{"name":"projectsveltos"}]}]'
          kubectl wait --for=condition=Ready mgmt/kcm --timeout=10m
          kubectl wait --for condition=available deployment/kcm-controller-manager --timeout=1m -n kcm-system
      - name: "[Latest Istio Release] Install CLI"
        run: |
          make cli-install
      - name: "[Latest Istio Release] Push Helm Charts"
        run: |
          make helm-push
      - name: "[Latest Istio Release] Go version"
        id: latest-istio-go-version
        uses: arnested/go-version-action@v2
        with:
          working-directory: istio-repo/istio-operator
      - name: "[Latest Istio Release] Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: istio-repo/istio-operator/go.mod
          cache: false
      - name: "[Latest Istio Release] Install Istio"
        run: |
          make dev-istio-deploy
      - name: "[Latest Istio Release] Run KIND Istio Child cluster"
        run: |
          make dev-adopted-deploy KIND_CLUSTER_NAME=adopted-cluster
      - name: Run KIND cloud provider
        run: docker run -d --rm --network kind -v /var/run/docker.sock:/var/run/docker.sock registry.k8s.io/cloud-provider-kind/cloud-controller-manager:v0.10.0
      - name: "[Latest Istio Release] Deploy Istio components on Child adopted cluster"
        run: |
          make dev-child-deploy-adopted
      - name: "[Pre-upgrade] Deploy server on Child adopted cluster"
        run: |
          kubectl config use-context kind-adopted-cluster
          kubectl create namespace sample
          kubectl label namespace sample istio-injection=enabled
          kubectl apply -f https://raw.githubusercontent.com/istio/istio/release-1.27/samples/helloworld/helloworld.yaml -l service=helloworld -n sample
          kubectl apply -f https://raw.githubusercontent.com/istio/istio/release-1.27/samples/helloworld/helloworld.yaml -l version=v1 -n sample
          kubectl rollout status deployment/helloworld-v1 -n sample --timeout=5m
          kubectl config use-context kind-kcm-dev
      - name: "[Pre-upgrade] Deploy curl pod on management cluster"
        run: |
          kubectl create namespace sample
          kubectl label namespace sample istio-injection=enabled
          kubectl apply -f https://raw.githubusercontent.com/istio/istio/release-1.27/samples/sleep/sleep.yaml -n sample
          kubectl rollout status deployment/sleep -n sample --timeout=5m
      - name: "[Pre-upgrade] Verify cross-cluster connectivity"
        run: |
          SLEEP_POD=$(kubectl get pod -n sample -l app=sleep -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 20); do
            if kubectl exec -n sample -c sleep "$SLEEP_POD" -- curl -sSf helloworld.sample:5000/hello; then
              echo "Pre-upgrade connectivity verified"
              break
            fi
            [ "$i" -eq 20 ] && { echo "Pre-upgrade connectivity check failed after 20 attempts"; exit 1; }
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Fetch PR Ref and Checkout Repo
        uses: ./.github/actions/fetch-pr-ref
      - name: "[Main KCM Branch] Checkout KCM repository"
        uses: actions/checkout@v5
        with:
          repository: k0rdent/kcm
          ref: ${{ env.KCM_NEXT_RELEASE }}
          path: kcm-repo
          fetch-depth: 0
      - name: "[Main KCM Branch] Go version"
        id: main-kcm-go-version
        uses: arnested/go-version-action@v2
        with:
          working-directory: kcm-repo
      - name: "[Main KCM Branch] Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: kcm-repo/go.mod
          cache: false
      - name: "[Main KCM Branch] Install CLI"
        run: |
          make -C kcm-repo cli-install
      - name: "[Main KCM Branch] Upgrade KCM"
        run: |
          make -C kcm-repo dev-upgrade
          kubectl wait --for=condition=Ready mgmt/kcm --timeout=10m
          kubectl patch mgmt/kcm --type='json' -p '[{"op": "replace", "path": "/spec/providers", "value":[{"name":"projectsveltos"}]}]'
      - name: "[PR] Go version"
        id: main-istio-go-version
        uses: arnested/go-version-action@v2
        with:
          working-directory: istio-operator
      - name: "[PR] Setup Go"
        uses: actions/setup-go@v6
        with:
          go-version-file: istio-operator/go.mod
          cache: false
      - name: "[PR] Install Istio CLI"
        run: |
          make cli-install
      - name: "[PR] Push Istio Helm Charts"
        run: |
          make helm-push
      - name: "[PR] Deploy Istio components on Mothership cluster"
        run: |
          make dev-istio-deploy
      - name: "[PR] Run KIND Istio Child adopted cluster"
        run: |
          make dev-adopted-deploy KIND_CLUSTER_NAME=adopted-cluster
          
      - name: "[PR] Deploy Istio components on Child adopted cluster"
        run: |
          make dev-child-deploy-adopted

      - name: "[Post-upgrade] Verify cross-cluster connectivity"
        run: |
          SLEEP_POD=$(kubectl get pod -n sample -l app=sleep -o jsonpath='{.items[0].metadata.name}')
          for i in $(seq 1 20); do
            if kubectl exec -n sample -c sleep "$SLEEP_POD" -- curl -sSf helloworld.sample:5000/hello; then
              echo "Post-upgrade connectivity verified"
              break
            fi
            [ "$i" -eq 20 ] && { echo "Post-upgrade connectivity check failed after 20 attempts"; exit 1; }
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
      - name: Make support-bundle
        if: ${{ failure() }}
        run: |
          make support-bundle
          make support-bundle KUBECTL_CONTEXT=kind-adopted-cluster
      - name: Archive support-bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-support-bundles.tar.gz
          path: ./support-bundle-*.tar.gz