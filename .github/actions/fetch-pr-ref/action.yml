name: Fetch PR Reference
description: Checks out the PR merge commit with full history
runs:
  using: "composite"
  steps:
    # `github.sha` is the merge commit of the PR head that triggered the run, while
    # `github.event.pull_request.merge_commit_sha` may still point to a previous head.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
